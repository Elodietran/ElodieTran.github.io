
title: "Elodie Tran | Data Analytics Portfolio"
description: "Business Analytics and IT portfolio showcasing data analysis, business projects, finance, and technology."
author: "Elodie Tran"
copyright: "Elodie Tran"

url: "https://elodietran.github.io"
baseurl: ""

future: false

highlighter: rouge
markdown: kramdown

# Enable Liquid processing in Markdown files.
# HTML files are processed by Jekyll by default.
render_with_liquid: true

plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist
  - jekyll-feed

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:year-:month-:day/:title.html

# Number of posts displayed on the homepage
paginate: 5

# Include additional files
include:
  - .htaccess

# Exclude development files from the generated website
exclude:
  - "*.less"
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - lib
  - log
  - node_modules
  - package.json
  - spec
  - tmp
